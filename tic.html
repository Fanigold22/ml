<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic Tic Tic Tac Tac Tac Toes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root {
  --pink: #d98fa8;
  --deep: #a95f7d;
  --cream: #fffaf7;
  --rose: #f8e7ed;
  --text: #795565;
  --line: #efd3de;
}

* {
  box-sizing: border-box;
}

body {
  background: radial-gradient(circle at 15% 10%, #fff 0, transparent 30%),
              linear-gradient(145deg, #fffaf7, #fcecf1 55%, #f7e1e9);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 20px;
  user-select: none;
  min-height: 100vh;
  margin: 0;
  position: relative;
  overflow-x: hidden;
}

body:before, body:after {
  content: '♡  ✧  ♡';
  position: fixed;
  color: #e5b7c8;
  opacity: .55;
  font-size: 24px;
  letter-spacing: 16px;
  pointer-events: none;
}
body:before { top: 18px; left: 20px; }
body:after { bottom: 18px; right: 10px; transform: rotate(-12deg); }

h1 {
  margin: 12px 0 15px;
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5vw, 2.8rem);
  color: #b66e8b;
  text-align: center;
  text-shadow: 0 3px 0 #fff;
  letter-spacing: .2px;
}

label[for="modeSelect"] {
  font-size: 0.95rem;
  color: #b28b9b;
  margin-bottom: 6px;
  font-weight: 500;
}

#modeSelect {
  margin-bottom: 25px;
  font-family: inherit;
  font-size: 1rem;
  padding: 10px 18px;
  border-radius: 24px;
  border: 1px solid var(--line);
  background: #fffafc;
  color: #a36c83;
  cursor: pointer;
  box-shadow: 0 4px 12px #dcaec01c;
  outline: none;
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
}

#modeSelect:hover {
  background: #ffffff;
  border-color: #e9c6d4;
  box-shadow: 0 6px 16px #dcaec02d;
}

#board {
  display: grid;
  grid-template-columns: repeat(3, 110px);
  grid-template-rows: repeat(3, 110px);
  gap: 15px;
  padding: 20px;
  border: 2px solid #e9c6d4;
  border-radius: 25px;
  background: linear-gradient(135deg, #fffdfcdd, #f9e8efdd);
  box-shadow: 0 12px 35px #bd81951c, inset 0 0 0 5px #fff9;
  position: relative;
}

#board:before {
  content: '♡  ✧  ♡  ✧  ♡';
  position: absolute;
  top: 6px;
  left: 16px;
  color: #e5bdcc;
  opacity: .6;
  font-size: 11px;
  letter-spacing: 8px;
  pointer-events: none;
}

.cell {
  background: linear-gradient(145deg, #ffffff, #fceef3);
  border-radius: 20px;
  border: 1px solid #f1dce4;
  font-size: 3.2rem;
  color: #ff4d4d;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 4px 12px #dcaec01a;
  transition: background 0.3s, transform 0.15s, box-shadow 0.2s;
  user-select: none;
}

.cell:hover {
  background: linear-gradient(145deg, #ffffff, #f8dce6);
  transform: scale(1.05);
  box-shadow: 0 6px 16px #dcaec030;
}

#status {
  margin-top: 25px;
  font-size: 1.1rem;
  color: #a66f85;
  font-weight: 600;
  background: #fff9fb;
  border: 1px solid #f1dce4;
  border-radius: 20px;
  padding: 10px 22px;
  box-shadow: 0 4px 12px #dcaec01a;
  min-height: 1.4em;
  display: flex;
  align-items: center;
  justify-content: center;
}

#restartBtn {
  margin-top: 20px;
  padding: 12px 30px;
  border-radius: 30px;
  border: 1px solid #dca5b9;
  background: linear-gradient(135deg, #e9b4c7, #d992ad);
  color: #fffdfd;
  font-family: inherit;
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
  box-shadow: 0 7px 16px #c987a333;
  transition: transform 0.2s, box-shadow 0.2s;
  user-select: none;
}

#restartBtn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px #c987a344;
}

@media (max-width: 480px) {
  #board {
    grid-template-columns: repeat(3, 85px);
    grid-template-rows: repeat(3, 85px);
    gap: 10px;
    padding: 15px;
  }
  .cell {
    font-size: 2.5rem;
  }
}
</style>
</head>
<body>

<h1>Hearts in a Row ❤️⭐</h1>

<label for="modeSelect">Choose opponent:</label>
<select id="modeSelect" aria-label="Choose opponent mode">
  <option value="twoPlayer">Two Players</option>
  <option value="bot">Play vs Bot</option>
</select>

<div id="board" role="grid" aria-label="Tic Tac Toe Board"></div>

<div id="status" aria-live="polite"></div>
<button id="restartBtn" aria-label="Restart game">Restart Game</button>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restartBtn');
  const modeSelect = document.getElementById('modeSelect');

  let board = ['', '', '', '', '', '', '', '', ''];
  let currentPlayer = '❤️'; // Human always starts as Hearts
  let gameActive = true;
  let vsBot = false;
  let botThinking = false;

  const winningConditions = [
    [0,1,2],[3,4,5],[6,7,8],  // Rows
    [0,3,6],[1,4,7],[2,5,8],  // Columns
    [0,4,8],[2,4,6]           // Diagonals
  ];

  function createBoard() {
    boardEl.innerHTML = '';
    for(let i=0; i<9; i++){
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.setAttribute('data-index', i);
      cell.setAttribute('role', 'button');
      cell.setAttribute('tabindex', '0');
      cell.setAttribute('aria-label', `Cell ${i+1}, ${board[i] ? board[i] : 'empty'}`);
      cell.addEventListener('click', handleCellClick);
      cell.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleCellClick(e);
        }
      });
      cell.textContent = board[i];
      if(board[i] === '⭐') cell.style.color = '#ffd700';
      else if(board[i] === '❤️') cell.style.color = '#ff4d4d';
      boardEl.appendChild(cell);
    }
  }

  function handleCellClick(e) {
    if (botThinking) return; // prevent clicking while bot is thinking

    const idx = e.target.getAttribute('data-index');
    if (board[idx] !== '' || !gameActive) return;

    if(vsBot && currentPlayer !== '❤️') return; // if vs bot, only allow human (hearts) to play on their turn

    makeMove(idx, currentPlayer);
    if (checkWin(currentPlayer)) {
      statusEl.textContent = `${currentPlayer} wins! 🎉`;
      gameActive = false;
      return;
    }
    if (board.every(cell => cell !== '')) {
      statusEl.textContent = `It's a tie! 🤝`;
      gameActive = false;
      return;
    }

    switchTurn();
  }

  function makeMove(index, player) {
    board[index] = player;
    createBoard();
  }

  function checkWin(player) {
    return winningConditions.some(condition => {
      return condition.every(idx => board[idx] === player);
    });
  }

  function switchTurn() {
    currentPlayer = currentPlayer === '❤️' ? '⭐' : '❤️';
    statusEl.textContent = `Turn: ${currentPlayer}`;

    if(vsBot && currentPlayer === '⭐' && gameActive){
      botThinking = true;
      setTimeout(botMove, 700);
    }
  }

  function botMove() {
    let available = board
      .map((val, idx) => val === '' ? idx : null)
      .filter(val => val !== null);

    // Bot tries to win if possible
    for(let idx of available) {
      board[idx] = '⭐';
      if(checkWin('⭐')) {
        makeMove(idx, '⭐');
        endGame('⭐');
        botThinking = false;
        return;
      }
      board[idx] = '';
    }
    // Bot blocks player if needed
    for(let idx of available) {
      board[idx] = '❤️';
      if(checkWin('❤️')) {
        board[idx] = '⭐';
        makeMove(idx, '⭐');
        botThinking = false;
        switchTurn();
        return;
      }
      board[idx] = '';
    }

    // Bot picks random move otherwise
    const move = available[Math.floor(Math.random() * available.length)];
    makeMove(move, '⭐');

    if (checkWin('⭐')) {
      endGame('⭐');
      botThinking = false;
      return;
    }
    if (board.every(cell => cell !== '')) {
      statusEl.textContent = `It's a tie! 🤝`;
      gameActive = false;
      botThinking = false;
      return;
    }
    botThinking = false;
    switchTurn();
  }

  function endGame(winner) {
    statusEl.textContent = `${winner} wins! 🎉`;
    gameActive = false;
  }

  restartBtn.addEventListener('click', () => {
    board = ['', '', '', '', '', '', '', '', ''];
    currentPlayer = '❤️';
    gameActive = true;
    botThinking = false;
    statusEl.textContent = `Turn: ${currentPlayer}`;
    createBoard();
  });

  modeSelect.addEventListener('change', () => {
    vsBot = modeSelect.value === 'bot';
    restartBtn.click();
  });

  // Initialize
  createBoard();
  statusEl.textContent = `Turn: ${currentPlayer}`;
</script>

</body>
</html>
