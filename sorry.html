<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff5e6;
color:#5a3c3f;
overflow-x:hidden;
position:relative;
}

/* sparkle background */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image: radial-gradient(#f9c5c8 1px, transparent 1px);
background-size:40px 40px;
opacity:0.25;
pointer-events:none;
z-index:-1;
}

/* floating icons */
.float{
position:fixed;
pointer-events:none;
opacity:0.3;
animation:float 15s linear infinite;
z-index:-1;
}

@keyframes float{
0%{ transform:translateY(110vh); }
100%{ transform:translateY(-10vh); }
}

/* hero (NOW ALWAYS VISIBLE, NO BUTTON START) */
.hero{
padding:80px 20px 40px;
text-align:center;
}

.hero h1{
font-size:70px;
color:#d87a87;
margin-bottom:20px;
}

.hero p{
font-size:20px;
max-width:700px;
margin:auto;
margin-bottom:40px;
}

/* MAGIC 8 BALL */
.ball{
width:300px;
height:300px;
border-radius:50%;
margin:60px auto;
background:radial-gradient(circle at 30% 30%, #444, #111 60%, #000);
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
position:relative;
box-shadow:
0 0 40px rgba(0,0,0,0.5),
inset -10px -10px 30px rgba(255,255,255,0.05),
inset 10px 10px 30px rgba(0,0,0,0.6);
}

.ball.shake{
animation:shake 0.6s;
}

@keyframes shake{
0%{ transform:translateX(0); }
20%{ transform:translateX(-10px); }
40%{ transform:translateX(10px); }
60%{ transform:translateX(-8px); }
80%{ transform:translateX(8px); }
100%{ transform:translateX(0); }
}
.triangle{
width:200px;
height:200px;
height:200px;
background:#16224a;
clip-path:polygon(50% 0%, 0% 100%, 100% 100%);
display:flex;
justify-content:center;
align-items:center;
}

.answer{
color:#fff;
font-size:14px;
font-weight:bold;
text-align:center;
line-height:1.3;

width:100px;

white-space:normal;
word-break:break-word;
overflow-wrap:break-word;

transform: translateY(20px);
}
.end h2{
  color:#d87a87;
  font-size:40px;
  text-align:center;
  margin-top:10px;
  letter-spacing:1px;
}
</style>
</head>

<body>

<!-- floating icons -->
<script>
const icons=["❤","✦","❀","♡","✧","💌"];

for(let i=0;i<30;i++){
let el=document.createElement("div");
el.className="float";
el.innerHTML=icons[Math.floor(Math.random()*icons.length)];
el.style.left=Math.random()*100+"vw";
el.style.fontSize=(16+Math.random()*24)+"px";
el.style.animationDuration=(10+Math.random()*10)+"s";
document.body.appendChild(el);
}
</script>

<!-- HERO TEXT (NO BUTTON ANYMORE) -->
<div class="hero">
<h1>Im sorry</h1>
<p>I miss you a lot.</p>
</div>

<!-- MAGIC 8 BALL -->
<div class="ball" id="ball" onclick="shakeBall()">
<div style="
position:absolute;
top:-50px;
width:100%;
text-align:center;
font-size:14px;
color:#5a3c3f;
opacity:0.9;
font-weight:600;
">
ASK THE MAGIC 8 BALL IF WE SHOULD GET BACK TOGETHER 
</div>
  <div class="triangle">
    <div class="answer" id="answer">
      ...
    </div>
  </div>

</div>
<!-- VIDEO SECTION -->
<div style="text-align:center; margin:60px 0;">
  <h2 style="color:#d87a87; margin-bottom:20px;">
    this is everything I couldn’t say in words
  </h2>

  <video controls width="500"
    style="border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<!-- END -->
<div class="end">
  <h2>No matter what happens, thank you.</h2>
</div>
<script>

const answers = [
"Yes",
"Absolutely",
"Definitely yes",
"Without a doubt",
"It is certain",
"Yes 100%",
"Signs point to yes",
"All indicators agree",
"Affirmative",
"It is decidedly so",
"As I see it, yes",
"The answer is yes",
"The stars say yes",
"For sure",
"That is correct",
"The result is yes",
"Why are you even thinking about it, YES"
];

function shakeBall(){

const ball = document.getElementById("ball");
const answer = document.getElementById("answer");

ball.classList.remove("shake");
void ball.offsetWidth;
ball.classList.add("shake");

answer.innerHTML = "...";

setTimeout(()=>{
const random = answers[Math.floor(Math.random()*answers.length)];
answer.innerHTML = random;
},600);

}

</script>

</body>
</html>
